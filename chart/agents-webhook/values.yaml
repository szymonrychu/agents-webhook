image:
  repository: harbor.szymonrichert.pl/containers/agents-webhook
  # Required: the image tag to deploy.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Postgres is required; there is no in-chart database. Set exactly one of url and existingSecret.
postgres:
  url: ""
  existingSecret: ""
  existingSecretKey: uri

# The agents-orchestrator the worker and api talk to. url is required; set token or tokenSecret
# (tokenSecret wins). The ingest pod never receives the token.
orchestrator:
  url: ""
  token: ""
  tokenSecret:
    name: ""
    key: token

# Public base URL used to print webhook URLs (WEBHOOK_PUBLIC_BASE_URL).
publicBaseUrl: https://lab.szymonrichert.pl

# CIDRs of reverse proxies whose X-Forwarded-For is trusted (WEBHOOK_TRUSTED_PROXIES).
trustedProxies: []

# Source allowlist of the api (WEBHOOK_API_ALLOWED_CIDRS, api pod only): the direct peer must be
# inside one of these CIDRs or the api answers 403 (probes excepted). The default admits only
# the oauth2-proxy sidecar on localhost, so in-cluster pods cannot skip SSO via the
# http-insecure Service port.
api:
  allowedCidrs:
    - 127.0.0.1/32

# Limits, rendered into the settings ConfigMap read by ingest and worker.
limits:
  # WEBHOOK_MAX_IN_PROGRESS: events running at once, across all endpoints.
  maxInProgress: 3
  # WEBHOOK_MAX_IN_PROGRESS_PER_ENDPOINT: events running at once for one endpoint.
  maxInProgressPerEndpoint: 1
  # WEBHOOK_MAX_QUEUE: queued events kept before ingest refuses new ones.
  queueCap: 500
  # WEBHOOK_MAX_BODY_BYTES: largest accepted request body (5 MiB).
  maxBodyBytes: 5242880

# WEBHOOK_TEMPLATE_MEMORY_MB: address space a prompt-template render child may allocate beyond
# its own baseline (RLIMIT_AS). A render over it fails the event with template_error. Keep every
# api and worker memory limit above this plus the pod's own usage (about 150 MiB).
templateMemoryMb: 256

# Extra WEBHOOK_* settings; keys must start with WEBHOOK_.
env: {}

# Pod annotations per component. Put oauth2-proxy / SSO annotations on api only: the public
# ingest pod must stay out of SSO.
components:
  ingest:
    replicas: 2
    podAnnotations: {}
    resources:
      requests: {cpu: 50m, memory: 128Mi}
      limits: {memory: 256Mi}
  api:
    replicas: 1
    podAnnotations: {}
    resources:
      requests: {cpu: 50m, memory: 192Mi}
      limits: {memory: 640Mi}
  worker:
    replicas: 1
    resources:
      requests: {cpu: 50m, memory: 192Mi}
      limits: {memory: 640Mi}

podLabels: {}
terminationGracePeriodSeconds: 30

# Used by the network templates (service and ingress).
service:
  type: ClusterIP
  port: 80

# Two Ingresses on one host: <fullname>-api at /webhooks/api (put SSO annotations in
# `annotations`) and <fullname>-ingest at /webhook, public and outside SSO. Set
# cert-manager.io/cluster-issuer in annotations/ingestAnnotations only when this release owns
# the host's certificate.
ingress:
  enabled: false
  className: ""
  host: ""
  tls:
    secretName: ""
  # Annotations for the api Ingress.
  annotations: {}
  # Source CIDRs the api Ingress refuses (ingress-nginx denylist; list the cluster node IPs).
  denySourceRanges: []
  # Annotations for the ingest Ingress only.
  ingestAnnotations: {}
  # Ingest Ingress limits: body size must be >= limits.maxBodyBytes (5 MiB).
  proxyBodySize: 5m
  proxyReadTimeout: "60"
  proxySendTimeout: "60"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

nodeSelector: {}
tolerations: []
affinity: {}
