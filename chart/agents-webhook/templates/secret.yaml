{{- if and .Values.postgres.url (not .Values.postgres.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agents-webhook.databaseSecretName" . }}
  labels:
    {{- include "agents-webhook.labels" . | nindent 4 }}
type: Opaque
stringData:
  uri: {{ .Values.postgres.url | quote }}
---
{{- end }}
{{- if and .Values.orchestrator.token (not (and .Values.orchestrator.tokenSecret .Values.orchestrator.tokenSecret.name)) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agents-webhook.tokenSecretName" . }}
  labels:
    {{- include "agents-webhook.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ .Values.orchestrator.token | quote }}
{{- end }}
