{{- range $component := list "ingest" "api" }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "agents-webhook.fullname" $ }}-{{ $component }}
  labels:
    {{- include "agents-webhook.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  type: {{ $.Values.service.type }}
  ports:
    - name: http
      port: {{ $.Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "agents-webhook.componentLabels" (dict "context" $ "component" $component) | nindent 4 }}
{{- end }}
